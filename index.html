<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#e8423b">
  <title>Store Smash — Dash Rush</title>
  <meta name="description" content="Store Smash: grab a randomized shopping list from a two-storey grocery store with a shopping cart, jump in your car and dash the order across town before a rival dasher poaches it.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23e8423b'/%3E%3Cpath d='M14 18h6l6 22h20l5-15H23' fill='none' stroke='%23fff6d8' stroke-width='5' stroke-linejoin='round'/%3E%3Ccircle cx='28' cy='49' r='4' fill='%23fff6d8'/%3E%3Ccircle cx='44' cy='49' r='4' fill='%23fff6d8'/%3E%3C/svg%3E">
  <link rel="preload" href="assets/fonts/LilitaOne.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    { "imports": { "three": "./js/vendor/three.module.min.js" } }
  </script>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="panes"></div>

  <div id="topbar" class="hidden">
    <div class="pill clock"><span class="lbl">ORDER</span><b id="clock">0:00</b></div>
    <div id="rivals"></div>
    <button id="btn-board" class="pill hidden" aria-label="Order board">📋</button>
    <button id="btn-pause" class="round" aria-label="Pause">❚❚</button>
  </div>

  <div id="toasts"></div>
  <div id="sticks"><div class="stick s0"><span></span></div><div class="stick s1"><span></span></div></div>
  <button id="btn-hop" class="act hidden" aria-label="Hop">HOP</button>
  <button id="btn-rush" class="act hidden" aria-label="Rush">RUSH</button>
  <button id="btn-punch" class="act hidden" aria-label="Punch">PUNCH</button>
  <button id="btn-cam" class="round hidden" aria-label="Switch camera">🎥</button>

  <div id="screen" class="hidden"></div>
  <div id="loading"><div class="logo small">STORE<br>SMASH</div><p>Stocking the shelves…</p></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
