name: Check & deploy (GitHub Pages)

# Dr. Mow's flow, on GitHub Pages:
#   every push: the headless proof (controller, grinds, reachability, combat, whole CPU shifts) — a red X blocks
#               the deploy
#   main:       the live game at https://mtd-public.github.io/store-smash/
# Pages must use "GitHub Actions" as its source (repo → Settings → Pages); the configure step tries to switch it
# on by itself the first time.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Headless proof
        run: node tools/sim-check.mjs 3

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Assemble site (only what the game serves)
        run: |
          mkdir -p _site
          cp -r index.html css js assets _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
